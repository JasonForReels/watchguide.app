<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Apple TV App Store screenshot (1920x1080). ?s=1..5, ?lang=es|zh, ?shot=<path to raw capture> -->
<style>
  :root { --coral: #FF5A45; --apricot: #FFA474; --peach: #FFE6CC; --night: #0B0820; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--night); }
  body { font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; color: #fff;
         -webkit-font-smoothing: antialiased; position: relative; }
  .layer { position: absolute; inset: 0; }
  .sky { background:
           radial-gradient(70% 60% at 50% 0%, rgba(98,74,214,.6) 0%, rgba(64,47,153,0) 70%),
           linear-gradient(180deg, #402F99 0%, #241a63 40%, #17113E 75%, var(--night) 100%); }
  .halo { background: radial-gradient(45% 40% at 50% 70%, rgba(255,158,107,.45) 0%, rgba(255,122,85,0) 75%); }
  .grain { opacity: .06; mix-blend-mode: overlay;
           background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

  .copy { position: absolute; top: 64px; left: 0; right: 0; text-align: center; z-index: 5; }
  .eyebrow { display: inline-flex; align-items: center; gap: 10px; padding: 9px 20px; border-radius: 999px;
             font-size: 22px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--peach);
             background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 1px rgba(255,230,204,.22); }
  .eyebrow img { width: 30px; height: 30px; border-radius: 7px; }
  h1 { margin-top: 22px; font-size: 92px; line-height: 1; font-weight: 800; letter-spacing: -0.04em; }
  h1 em { font-style: normal; background: linear-gradient(95deg, var(--peach) 0%, var(--apricot) 45%, var(--coral) 100%);
          -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin-top: 18px; font-size: 32px; font-weight: 500; color: rgba(255,240,230,.75); }

  /* The TV: the real capture, framed as a slim screen, rising from the bottom */
  .tv { position: absolute; left: 50%; top: 395px; width: 1400px; margin-left: -700px; z-index: 3;
        padding: 14px; border-radius: 26px; background: linear-gradient(160deg, #3d3a4c, #15141c 60%, #2b2938);
        box-shadow: 0 0 0 1px rgba(255,255,255,.12) inset, 0 0 140px rgba(255,138,96,.35), 0 60px 120px rgba(6,3,20,.8); }
  .tv img { display: block; width: 100%; border-radius: 14px; }
</style>
</head>
<body>
<div class="layer sky"></div>
<div class="layer halo"></div>
<div class="layer grain"></div>
<div class="copy">
  <div class="eyebrow" id="eb"></div>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
</div>
<div class="tv"><img id="shot"></div>
<script>
const COPY = {
  en: [
    ["Watch Guide", "Know what to <em>watch.</em>", "Every movie and show, beautifully guided — on the big screen."],
    ["Tonight", "Can't decide? <em>Tonight picks.</em>", "One pick at a time — and why it's for you."],
    ["Search", "Find anything, <em>fast.</em>", "Movies, shows, people and studios — from your couch."],
    ["StreamQ", "Only what's on <em>your services.</em>", "Plus what's leaving soon, before it's gone."],
    ["Your lists", "A watchlist <em>worth keeping.</em>", "Watchlist, watched, liked — synced with your iPhone."],
  ],
  es: [
    ["Watch Guide", "Descubre qué <em>ver.</em>", "Cada película y serie, guiada con estilo, en la pantalla grande."],
    ["Esta noche", "¿No te decides? <em>Elegimos por ti.</em>", "Una propuesta cada vez, y por qué es para ti."],
    ["Buscar", "Encuentra lo que sea, <em>al instante.</em>", "Películas, series, personas y estudios, desde el sofá."],
    ["StreamQ", "Solo lo que hay <em>en tus servicios.</em>", "Y lo que se va pronto, antes de que desaparezca."],
    ["Tus listas", "Una lista <em>que vale la pena.</em>", "Mi lista, vistos, me gusta, sincronizados con tu iPhone."],
  ],
  zh: [
    ["Watch Guide", "看什么，<em>一目了然。</em>", "每一部电影和剧集，在大屏幕上为你精心指引。"],
    ["Tonight", "选择困难？<em>帮你挑。</em>", "一次推荐一部，还告诉你为什么适合你。"],
    ["搜索", "想找什么，<em>马上找到。</em>", "电影、剧集、演员和片厂，坐在沙发上就能搜。"],
    ["StreamQ", "只看你订阅的<em>流媒体平台。</em>", "还有即将下架的内容，别错过。"],
    ["片单", "值得珍藏的<em>观影片单。</em>", "想看、看过、喜欢，与 iPhone 同步。"],
  ],
};
const p = new URLSearchParams(location.search);
const lang = p.get("lang") || "en";
const [eb, title, sub] = (COPY[lang] || COPY.en)[(+p.get("s") || 1) - 1];
document.getElementById("eb").innerHTML = `<img src="icon.png">${eb}`;
document.getElementById("title").innerHTML = title;
document.getElementById("sub").textContent = sub;
document.getElementById("shot").src = p.get("shot");
if (lang === "zh") {
  document.documentElement.lang = "zh-Hans";
  document.head.insertAdjacentHTML("beforeend", `<style>body{font-family:"PingFang SC",-apple-system,sans-serif}h1{letter-spacing:0;font-weight:600}</style>`);
} else if (lang === "es") document.documentElement.lang = "es";
</script>
</body>
</html>
