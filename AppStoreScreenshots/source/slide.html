<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- App Store screenshot template, v3: built around the Icon Composer app icon
     (indigo tile, glowing coral screen, light beam). Render one slide with ?s=1..6 -->
<style>
  :root {
    --W: 1320px; --H: 2868px;
    --indigo-1: #402F99; --indigo-2: #17113E; --night: #0B0820;
    --coral: #FF5A45; --apricot: #FFA474; --peach: #FFE6CC; --sand: #FFD3A6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: var(--W); height: var(--H); overflow: hidden; background: var(--night); }
  body { font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; color: #fff;
         -webkit-font-smoothing: antialiased; position: relative; }
  .layer { position: absolute; inset: 0; }

  /* Brand world: the icon's indigo, lit from the phone like the icon's screen */
  .sky { background:
           radial-gradient(90% 40% at 50% 0%, rgba(98,74,214,.55) 0%, rgba(64,47,153,0) 70%),
           linear-gradient(180deg, var(--indigo-1) 0%, #241a63 38%, var(--indigo-2) 70%, var(--night) 100%); }
  .tint { background-size: 100% 100%; opacity: .32; mix-blend-mode: soft-light; }
  .streak { background-size: 100% 100%; mix-blend-mode: screen; opacity: .55; }
  .halo { /* the screen's glow, centred behind the phone */
    background: radial-gradient(48% 30% at 50% var(--halo-y, 52%), rgba(255,158,107,.62) 0%,
                rgba(255,122,85,.22) 45%, rgba(255,122,85,0) 75%); }
  .rays { /* light fanning up from the phone, like the icon's beam turned skyward */
    background: conic-gradient(from 180deg at 50% var(--ray-y, 58%),
      rgba(255,211,166,0) 0deg, rgba(255,211,166,.10) 150deg, rgba(255,211,166,0) 160deg,
      rgba(255,211,166,.14) 172deg, rgba(255,211,166,0) 180deg, rgba(255,211,166,.14) 188deg,
      rgba(255,211,166,0) 200deg, rgba(255,211,166,.10) 210deg, rgba(255,211,166,0) 360deg);
    mask-image: linear-gradient(180deg, rgba(0,0,0,0) 8%, #000 40%, rgba(0,0,0,.4) 70%, rgba(0,0,0,0) 85%); }
  .grain { opacity: .06; mix-blend-mode: overlay;
           background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .vignette { background: radial-gradient(120% 80% at 50% 45%, rgba(0,0,0,0) 55%, rgba(5,3,18,.55) 100%); }

  /* Copy */
  .copy { position: absolute; left: 100px; right: 100px; top: 180px; z-index: 5; }
  .eyebrow { display: inline-flex; align-items: center; gap: 16px; padding: 14px 26px 14px 20px; border-radius: 999px;
             font-size: 34px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--peach);
             background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 1.5px rgba(255,230,204,.22); }
  .eyebrow svg { width: 38px; height: 38px; }
  h1 { margin-top: 38px; font-size: 158px; line-height: .97; font-weight: 800; letter-spacing: -0.045em; }
  h1 em { font-style: normal; background: linear-gradient(95deg, var(--peach) 0%, var(--apricot) 45%, var(--coral) 100%);
          -webkit-background-clip: text; background-clip: text; color: transparent;
          filter: drop-shadow(0 0 40px rgba(255,122,85,.35)); }
  .sub { margin-top: 34px; font-size: 50px; line-height: 1.25; font-weight: 500; color: rgba(255,240,230,.72); }

  /* Device */
  .phone { position: absolute; left: 50%; width: 1044px; margin-left: -522px;
           padding: 22px; border-radius: 156px; z-index: 3; transform-origin: 50% 0;
           background: linear-gradient(145deg, #6b6680 0%, #2c2a38 22%, #1a1922 55%, #45425a 100%);
           box-shadow: 0 0 0 3px rgba(255,255,255,.10) inset, 0 0 0 1px rgba(0,0,0,.9),
                       0 0 160px rgba(255,138,96,.38), 0 90px 170px rgba(6,3,20,.75); }
  .phone::before { content: ""; position: absolute; inset: 10px; border-radius: 146px;
                   border: 2px solid rgba(255,255,255,.07); pointer-events: none; }
  .phone img { display: block; width: 1000px; border-radius: 134px; }
  .phone .dim { position: absolute; inset: 22px; border-radius: 134px; background: rgba(11,8,32,.38); }
  .btn { position: absolute; width: 10px; border-radius: 4px; background: linear-gradient(90deg,#2a2a33,#5a5770); }

  .callout { position: absolute; z-index: 6; border-radius: 44px; background-repeat: no-repeat;
             box-shadow: 0 0 0 3px rgba(255,211,166,.55), 0 0 0 10px rgba(255,164,116,.12),
                         0 50px 110px rgba(6,3,20,.7), 0 0 150px rgba(255,122,85,.5); }

  /* Hero: the icon, its beam pouring down onto the phones */
  .hero .copy { top: 610px; text-align: center; left: 60px; right: 60px; }
  .hero h1 { font-size: 172px; }
  .hero .sub { font-size: 54px; }
  .hero-icon { position: absolute; z-index: 6; left: 50%; top: 150px; width: 380px; margin-left: -190px;
               filter: drop-shadow(0 40px 70px rgba(6,3,20,.6)); }
  .beam { position: absolute; z-index: 1; left: 0; right: 0; top: 330px; height: 2300px;
          background: linear-gradient(180deg, rgba(255,211,166,.55) 0%, rgba(255,179,126,.22) 40%, rgba(255,154,106,0) 85%);
          clip-path: polygon(43% 0, 57% 0, 108% 100%, -8% 100%);
          -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 30%, #000 70%, transparent 100%); }
  .hero-halo { position: absolute; z-index: 2; left: 50%; top: 40px; width: 1100px; height: 700px; margin-left: -550px;
               background: radial-gradient(50% 50% at 50% 50%, rgba(255,158,107,.55), rgba(255,122,85,0) 70%); }
  .badges { position: absolute; z-index: 7; left: 0; right: 0; bottom: 120px; display: flex; justify-content: center; gap: 22px; }
  .badge { padding: 20px 34px; border-radius: 999px; font-size: 36px; font-weight: 650; color: var(--peach);
           background: rgba(23,17,62,.72); box-shadow: inset 0 0 0 1.5px rgba(255,230,204,.25), 0 20px 50px rgba(6,3,20,.5);
           backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
</style>
</head>
<body>
<div class="layer sky"></div>
<div class="layer tint" id="tint"></div>
<div class="layer streak" id="streak"></div>
<div class="layer halo" id="halo"></div>
<div class="layer rays" id="rays"></div>
<div class="layer vignette"></div>
<div class="layer grain"></div>
<div class="copy" id="copy"></div>
<script>
const ICONS = {
  spark: '<path d="M12 2l2.2 6.3L20.5 10l-6.3 2.2L12 18.5l-2.2-6.3L3.5 10l6.3-1.7z" fill="currentColor"/>',
  cards: '<rect x="3" y="5" width="12" height="16" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 3h9.5A2.5 2.5 0 0 1 21 5.5V17" fill="none" stroke="currentColor" stroke-width="2"/>',
  star:  '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z" fill="currentColor"/>',
  tv:    '<rect x="2.5" y="4" width="19" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 21h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
  list:  '<path d="M8 6h13M8 12h13M8 18h13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="4" cy="6" r="1.5" fill="currentColor"/><circle cx="4" cy="12" r="1.5" fill="currentColor"/><circle cx="4" cy="18" r="1.5" fill="currentColor"/>',
  palette: '<path d="M12 3a9 9 0 1 0 0 18c1.2 0 2-.8 2-1.8 0-1.2-1-1.6-1-2.7 0-1 .8-1.5 1.8-1.5H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="7.5" cy="11" r="1.4" fill="currentColor"/><circle cx="10" cy="7" r="1.4" fill="currentColor"/><circle cx="15" cy="7" r="1.4" fill="currentColor"/>',
};
const SLIDES = {
  1: { hero: true, img: "browse.png", title: "Know what<br>to <em>watch.</em>",
       sub: "Every movie and show, beautifully guided." },
  2: { img: "tonight.png", icon: "cards", eyebrow: "Tonight", title: "Can't decide?<br><em>Just swipe.</em>",
       sub: "One pick at a time — and why it's for you.", top: 1010, halo: "60%",
       callout: { x: 73, y: 1940, w: 1059, h: 300, scale: 1.14, dy: -60 } },
  3: { img: "detail.png", icon: "star", eyebrow: "Every title", title: "Every rating.<br><em>One glance.</em>",
       sub: "Four critics' scores, side by side.", top: 950, halo: "60%",
       callout: { x: 40, y: 1925, w: 930, h: 200, scale: 1.3, dy: -10 } },
  4: { img: "streamq.png", icon: "tv", eyebrow: "StreamQ", title: "Only what's on<br><em>your services.</em>",
       sub: "Pick your subscriptions. The rest disappears.", top: 1010, halo: "55%",
       callout: { x: 40, y: 545, w: 920, h: 115, scale: 1.4, dy: 0 } },
  5: { img: "lists.png", icon: "list", eyebrow: "Your lists", title: "A watchlist<br><em>worth keeping.</em>",
       sub: "Watchlist, watched, liked — and lists of your own.", top: 1010, halo: "60%",
       callout: { x: 40, y: 568, w: 1000, h: 124, scale: 1.3, dy: 0 } },
  6: { img: "themes.png", icon: "palette", eyebrow: "Themes", title: "Make it<br><em>your cinema.</em>",
       sub: "Marquee, Noir, Drive-In — even the holidays.", top: 1010, halo: "55%",
       callout: { x: 90, y: 592, w: 1026, h: 360, scale: 1.12, dy: -10 } },
};

// Simplified Chinese captions (?lang=zh). Feature names stay in English to match the app's UI.
const ZH = {
  1: { title: "今晚看什么<br><em>一目了然。</em>", sub: "每一部电影和剧集，都为你精心指引。" },
  2: { eyebrow: "Tonight", title: "选择困难？<br><em>滑一滑就好。</em>", sub: "一次推荐一部，还告诉你为什么适合你。" },
  3: { eyebrow: "每部作品", title: "所有评分<br><em>一眼看全。</em>", sub: "四大评分平台，并排对比。" },
  4: { eyebrow: "StreamQ", title: "只看你订阅的<br><em>流媒体平台。</em>", sub: "选好你的订阅服务，其余内容自动隐藏。" },
  5: { eyebrow: "片单", title: "值得珍藏的<br><em>观影片单。</em>", sub: "想看、看过、喜欢，还有你自己的片单。" },
  6: { eyebrow: "主题", title: "打造你的<br><em>私人影院。</em>", sub: "Marquee、Noir、Drive-In，还有节日主题。" },
};
// Spanish captions (?lang=es). Feature names match the Spanish app UI.
const ES = {
  1: { title: "Descubre<br>qué <em>ver.</em>", sub: "Cada película y serie, guiada con estilo." },
  2: { eyebrow: "Esta noche", title: "¿No te decides?<br><em>Desliza.</em>", sub: "Una propuesta cada vez, y por qué es para ti." },
  3: { eyebrow: "Cada título", title: "Todas las notas.<br><em>De un vistazo.</em>", sub: "Cuatro críticas, una al lado de otra." },
  4: { eyebrow: "StreamQ", title: "Solo lo que hay<br><em>en tus servicios.</em>", sub: "Elige tus suscripciones. El resto desaparece." },
  5: { eyebrow: "Tus listas", title: "Una lista<br><em>que vale la pena.</em>", sub: "Mi lista, vistos, me gusta y tus propias listas." },
  6: { eyebrow: "Temas", title: "Conviértela en<br><em>tu cine.</em>", sub: "Marquee, Noir, Autocine… y hasta las fiestas." },
};
const LANG = new URLSearchParams(location.search).get("lang");
if (LANG === "es") { for (const k in ES) Object.assign(SLIDES[k], ES[k]); document.documentElement.lang = "es"; }
if (LANG === "zh") {
  for (const k in ZH) Object.assign(SLIDES[k], ZH[k]);
  document.documentElement.lang = "zh-Hans";
  document.head.insertAdjacentHTML("beforeend", `<style>
    body { font-family: "PingFang SC", -apple-system, sans-serif; }
    h1 { letter-spacing: 0; font-weight: 600; line-height: 1.12; }
    .eyebrow { letter-spacing: .08em; }
  </style>`);
}
const n = new URLSearchParams(location.search).get("s") || "1";
const s = SLIDES[n];
document.getElementById("tint").style.backgroundImage = `url(amb_${s.img})`;
document.getElementById("streak").style.backgroundImage = `url(ribbon_${n}.png)`;
if (s.halo) { document.body.style.setProperty("--halo-y", s.halo); document.body.style.setProperty("--ray-y", s.halo); }

function makePhone(img, top, extra = {}) {
  const p = document.createElement("div"); p.className = "phone"; p.style.top = top + "px";
  p.innerHTML = `<img src="${img}">` + (extra.dim ? `<div class="dim"></div>` : "");
  ["right:-8px;top:520px;height:200px", "left:-8px;top:420px;height:110px",
   "left:-8px;top:580px;height:180px", "left:-8px;top:800px;height:180px"]
    .forEach(st => { const b = document.createElement("div"); b.className = "btn"; b.style.cssText = st; p.appendChild(b); });
  if (extra.transform) p.style.transform = extra.transform;
  if (extra.z) p.style.zIndex = extra.z;
  document.body.appendChild(p); return p;
}

const copy = document.getElementById("copy");
const eyebrow = s.eyebrow ? `<div class="eyebrow"><svg viewBox="0 0 24 24">${ICONS[s.icon]}</svg>${s.eyebrow}</div>` : "";
copy.innerHTML = `${eyebrow}<h1>${s.title}</h1>` + (s.sub ? `<p class="sub">${s.sub}</p>` : "");

if (s.hero) {
  document.body.classList.add("hero");
  document.getElementById("halo").style.display = "none";
  document.getElementById("rays").style.display = "none";
  document.body.insertAdjacentHTML("beforeend",
    `<div class="beam"></div><div class="hero-halo"></div><img class="hero-icon" src="icon.png">`);
  makePhone("tonight.png", 1560, { transform: "translateX(-420px) rotate(-10deg) scale(.66)", z: 2, dim: true });
  makePhone("detail.png",  1560, { transform: "translateX(420px) rotate(10deg) scale(.66)",  z: 2, dim: true });
  makePhone("browse.png",  1390, { transform: "scale(.8)", z: 4 });
} else {
  makePhone(s.img, s.top);
}

if (s.callout) {
  const c = s.callout, k = (1000 / 1206) * c.scale, base = 1000 / 1206;
  const cx = 160 + (c.x + c.w / 2) * base, cy = s.top + 22 + (c.y + c.h / 2) * base + (c.dy || 0);
  const el = document.createElement("div"); el.className = "callout";
  el.style.cssText += `left:${cx - c.w * k / 2}px;top:${cy - c.h * k / 2}px;width:${c.w * k}px;height:${c.h * k}px;` +
    `background-image:url(${s.img});background-size:${1206 * k}px auto;background-position:-${c.x * k}px -${c.y * k}px;`;
  document.body.appendChild(el);
}
</script>
</body>
</html>
