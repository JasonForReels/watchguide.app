# Free Supabase projects pause after ~7 days without activity, which breaks
# sign-in. This reads one row every 3 days so the project stays awake.
# Needs repo secrets SUPABASE_URL and SUPABASE_ANON_KEY.
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 9 */3 * *" # every 3 days, 09:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Add SUPABASE_URL and SUPABASE_ANON_KEY as repository secrets."
            exit 1
          fi
          curl -fsS --retry 3 --retry-delay 10 \
            "${SUPABASE_URL%/}/rest/v1/api_cache?select=*&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -o /dev/null
          echo "Supabase responded — project is awake."
